  <style>
    :root { color-scheme: light; --ink: #264f63; --cream: #fff5c8; --paper: #f7faf2; --pink: #f4d4c2; --yellow: #ffe4a8; }
    * { box-sizing: border-box; }

    a:focus-visible, button:focus-visible { outline: 3px solid var(--ink); outline-offset: 5px; }

    main { --panel-width: 67%; --panel-left: 20.5%; max-width: 1600px; margin: max(-4.857143vw, -77.714px) auto 0; }
    .hero { position: relative; overflow: hidden; width: 100%; aspect-ratio: 7 / 4; background: linear-gradient(#eeffc8 57.25%, var(--cream) 57.25%); }
    .scene { position: absolute; left: -38%; width: 185.714286%; }

    .hero::after { content: ""; position: absolute; bottom: 0; left: var(--panel-left); width: var(--panel-width); height: 2.15vw; max-height: 34.4px; background: var(--paper); pointer-events: none; }

  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const scene = document.querySelector('.scene');
    const smallScreen = window.matchMedia('(max-width: 800px)');
    function setMenuOpen(open) {
      scene.classList.toggle('menu-open', open);
      menuToggle.setAttribute('aria-expanded', String(open));
      menuToggle.setAttribute('aria-label', open ? '센터 메뉴 닫기' : '센터 메뉴 열기');
    }
    menuToggle.addEventListener('click', () => {
      setMenuOpen(menuToggle.getAttribute('aria-expanded') !== 'true');
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && smallScreen.matches && menuToggle.getAttribute('aria-expanded') === 'true') {
        setMenuOpen(false);
        menuToggle.focus();
      }
    });
    smallScreen.addEventListener('change', () => setMenuOpen(false));
    document.documentElement.classList.add('js');
    menuToggle.hidden = false;
  </script>
